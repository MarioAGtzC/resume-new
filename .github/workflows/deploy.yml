name: Deploy site + CV

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate cv.tex from resume.json
        run: npx tsx scripts/generate-cv-tex.ts

      - name: Compile CV to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Validate PDF text extraction
        run: |
          TEXT=$(pdftotext cv.pdf - | tr -d '[:space:]')
          if [ -z "$TEXT" ]; then
            echo "ERROR: PDF text extraction returned empty content"
            exit 1
          fi
          echo "PDF text extraction check passed ($(echo "$TEXT" | wc -c) characters)"

      - name: Move CV into public directory
        run: mkdir -p public && mv cv.pdf public/mario-gutierrez-cv.pdf

      - name: Build site
        run: npm run build
        env:
          VITE_SITE_KEY: ${{ secrets.VITE_SITE_KEY }}
          VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4