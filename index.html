<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mario Gutiérrez" />
    <meta name="theme-color" content="#f6f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="https://mario-gutierrez.com/" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_SHARE_DESCRIPTION%" />
    <meta property="og:image" content="https://portfolio.mario-gutierrez.com/og/resume.jpg" />
    <meta property="og:url" content="https://mario-gutierrez.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_SHARE_DESCRIPTION%" />
    <meta name="twitter:image" content="https://portfolio.mario-gutierrez.com/og/resume.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
