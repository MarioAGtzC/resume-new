name: Deploy site + CV

on:
  push:
    branches: [main]

# Two publishes in a row: only the newest one deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # cv.tex arrives in the commit, generated by the Site Content Manager.
      - name: Compile CV to PDF
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Validate PDF text extraction
        run: |
          TEXT=$(pdftotext cv.pdf - | tr -d '[:space:]')
          if [ -z "$TEXT" ]; then
            echo "ERROR: PDF text extraction returned empty content"
            exit 1
          fi
          echo "PDF text extraction check passed ($(echo "$TEXT" | wc -c) characters)"

      - name: Move CV into public directory
        run: mkdir -p public && mv cv.pdf public/mario-gutierrez-cv.pdf

      - name: Build site
        run: npm run build
        env:
          VITE_SITE_KEY: ${{ secrets.VITE_SITE_KEY }}
          VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4